name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - run: cargo fetch --locked
      - run: cargo build --release --locked --offline
      - run: cargo test --locked --offline
      - run: cargo clippy --locked --offline --all-targets --all-features -- -D warnings
